name: Testes de API - Smoke

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-tests:
    name: Executar testes de API
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Executar testes de smoke da API
        run: npm run test:api:smoke

      - name: Publicar relatório Playwright
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-testes-api
          path: playwright-report/
          if-no-files-found: warn
          retention-days: 14
